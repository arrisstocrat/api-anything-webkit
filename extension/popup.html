<!doctype html><html lang="ru"><meta charset="utf-8"><title>API Anything</title>
<style>body{font:14px system-ui;width:320px;padding:14px}input,button{font:inherit;margin:6px 0;padding:7px}input{width:95%}button{width:100%}#status{white-space:pre-wrap}</style>
<h3>API Anything</h3><p>Связь с локальным приложением. Подключение позволяет читать список вкладок. Содержимое сайта доступно только после отдельного разрешения.</p>
<label>Имя браузера <input id="name" placeholder="Safari или Orion"></label>
<button id="connect">Подключить</button><button id="grant">Разрешить чтение текущего сайта</button><button id="disconnect">Отключить</button><p id="status"></p><script src="popup.js"></script></html>
